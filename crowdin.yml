# Optional tooling; translations can also be contributed directly as Android XML PRs.
project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN
base_path: .
preserve_hierarchy: true
files:
  - source: /immich-extension/src/main/res/values/*strings.xml
    translation: /immich-extension/src/main/res/values-%android_code%/%original_file_name%
    skip_untranslated_strings: true
  - source: /local-extension/src/main/res/values/*strings.xml
    translation: /local-extension/src/main/res/values-%android_code%/%original_file_name%
    skip_untranslated_strings: true
  - source: /moeview-extension/src/main/res/values/*strings.xml
    translation: /moeview-extension/src/main/res/values-%android_code%/%original_file_name%
    skip_untranslated_strings: true
  - source: /findthatmeme-extension/src/main/res/values/*strings.xml
    translation: /findthatmeme-extension/src/main/res/values-%android_code%/%original_file_name%
    skip_untranslated_strings: true
  - source: /googlephotos-extension/src/main/res/values/*strings.xml
    translation: /googlephotos-extension/src/main/res/values-%android_code%/%original_file_name%
    skip_untranslated_strings: true
