plugins { alias libs.plugins.android.application }

android {
    lint { disable += 'MissingTranslation' } // Android falls back to the default English strings.
    namespace 'one.njk.sao.extension.googlephotos'
    compileSdk 37
    defaultConfig {
        applicationId 'one.njk.sao.extension.googlephotos'
        minSdk 30
        targetSdk 36
        versionCode 6
        versionName '0.1.5'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        debug { pseudoLocalesEnabled true }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_21; targetCompatibility JavaVersion.VERSION_21 }
    buildFeatures { viewBinding true; buildConfig true; aidl true }
    sourceSets { main { assets.srcDir rootProject.file('third_party/xob0t') } }
}

dependencies {
    implementation project(':extension-runtime')
    // The same API used by SAO; supplied by Vector, absent from this APK's runtime dependencies.
    compileOnly libs.libxposed.api
    implementation libs.source.api
    implementation libs.source.settings
    implementation libs.okhttp
    implementation libs.androidx.appcompat
    implementation libs.lifecycle.viewmodel
    implementation libs.lifecycle.runtime
    implementation libs.android.material
    testImplementation libs.junit
    androidTestImplementation libs.bundles.testing
    androidTestImplementation libs.mockwebserver
}
