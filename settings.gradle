pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Review builds consume a staged, versioned SDK without publishing a GitHub release.
        ivy {
            name = 'SaoSourceSdkLocal'
            url = providers.gradleProperty('saoSdkRepo').map { new File(it) }.getOrElse(new File(settingsDir, '../SAO/build/source-sdk'))
            patternLayout {
                artifact '[artifact]-[revision](-[classifier]).[ext]'
                ivy '[module]-[revision].ivy.xml'
            }
            metadataSources { ivyDescriptor() }
            content { includeGroup 'one.njk.sao' }
        }
        ivy {
            name = 'SaoSourceSdk'
            url = 'https://github.com/nijuyonkadesu/SAO/releases/download/source-sdk-1.1.0'
            patternLayout {
                artifact '[artifact]-[revision](-[classifier]).[ext]'
                ivy '[module]-[revision].ivy.xml'
            }
            metadataSources { ivyDescriptor() }
            content { includeGroup 'one.njk.sao' }
        }
    }
}
rootProject.name = 'SAO-extensions'
include ':extension-runtime'
include ':immich', ':immich-provider', ':immich-extension', ':local-extension'
include ':moeview', ':moeview-extension', ':findthatmeme-extension'

include ':googlephotos-extension'
